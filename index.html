<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lewis@arch: ~ (GCSE Cybersecurity Portfolio)</title>
  <style>
    :root {
      --bg-color: #050505;
      --term-green: #33ff33;
      --term-glow: 0 0 15px rgba(51, 255, 51, 0.4);
      --error-red: #ff5555;
      --dir-blue: #5fb9ff;
      --exec-gold: #f1fa8c;
    }

    body {
      background-color: #000;
      color: var(--term-green);
      font-family: 'Fira Code', 'JetBrains Mono', 'Source Code Pro', monospace;
      margin: 0;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* --- CRT & MONITOR AESTHETICS --- */
    .monitor {
      position: relative;
      width: 95vw;
      height: 85vh;
      max-width: 1100px;
      background: var(--bg-color);
      border: 12px solid #2a2a2a;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.9), inset 0 0 80px rgba(0,0,0,1);
      display: flex;
      flex-direction: column;
    }

    .screen {
      flex: 1;
      padding: 30px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .screen::after {
      content: "";
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.3) 100%);
      pointer-events: none;
      z-index: 10;
    }

    .scanlines {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
      background-size: 100% 4px;
      z-index: 11;
      pointer-events: none;
    }

    /* --- TERMINAL ELEMENTS --- */
    #terminal {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none;
      text-shadow: var(--term-glow);
    }
    #terminal::-webkit-scrollbar { display: none; }

    .line { margin-bottom: 4px; line-height: 1.4; white-space: pre-wrap; }
    .prompt-row { color: #fff; font-weight: bold; }
    .user { color: #50fa7b; }
    .host { color: #8be9fd; }
    .cwd { color: #bd93f9; }
    .error { color: var(--error-red); }
    .dir { color: var(--dir-blue); font-weight: bold; }
    .file { color: #f8f8f2; }

    .input-wrapper { display: flex; margin-top: 10px; }
    input {
      background: transparent;
      border: none;
      color: var(--term-green);
      font-family: inherit;
      font-size: 1rem;
      flex: 1;
      outline: none;
      caret-color: var(--term-green);
      padding-left: 10px;
    }

    /* --- STATUS BAR --- */
    .status-bar {
      height: 25px;
      background: #111;
      border-top: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 0.8rem;
      color: #666;
    }

    @keyframes glitch {
      0% { transform: translate(0); }
      2% { transform: translate(-2px, 1px); }
      4% { transform: translate(2px, -1px); }
      100% { transform: translate(0); }
    }
    .glitch-active { animation: glitch 0.3s ease-in-out; }
  </style>
</head>
<body>

<div class="monitor" id="monitor">
  <div class="scanlines"></div>
  <div class="screen">
    <div id="terminal">
      <div id="output"></div>
      <div class="input-wrapper" id="input-line">
        <span id="prompt-content"></span>
        <input type="text" id="cmd" autofocus autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>
  <div class="status-bar">
    <span>SYSTEM: ARCH_LINUX // NODE: EASTBOURNE</span>
    <span id="clock">00:00:00</span>
    <span>CPU: 9950X @ 42°C</span>
  </div>
</div>

<script>
  const output = document.getElementById('output');
  const input = document.getElementById('cmd');
  const promptContent = document.getElementById('prompt-content');
  const monitor = document.getElementById('monitor');

  // 1. NESTED FILE SYSTEM
  const fs = {
    "home": {
      "lewis": {
        "projects": {
          "scanner.py": "import socket\n# TODO: Finalize GCSE port scanner logic",
          "arch-config.sh": "pacman -Syu --noconfirm"
        },
        "about.txt": "Cybersecurity student based in Eastbourne.\nInterests: Penetration Testing, Arch Linux, Hardware.",
        "specs.log": "CPU: Ryzen 9 9950X\nGPU: RX 7900XTX\nRAM: 32GB 6000MHz",
        ".secret_key": "SHA256: 8f43... [ENCRYPTED]"
      }
    }
  };

  // 2. STATE TRACKING
  let currentPath = ["home", "lewis"];
  let history = [];
  let historyIdx = -1;

  // 3. UTILITY FUNCTIONS
  function getCWD() {
    let dir = fs;
    for (let part of currentPath) { dir = dir[part]; }
    return dir;
  }

  function updatePrompt() {
    const pathStr = "~/" + currentPath.slice(2).join("/");
    promptContent.innerHTML = `<span class="user">lewis</span>@<span class="host">arch</span>:<span class="cwd">${pathStr}</span>$`;
  }

  function print(text, className = 'line') {
    const div = document.createElement('div');
    div.className = className;
    div.textContent = text;
    output.appendChild(div);
    output.scrollTop = output.scrollHeight;
  }

  // Live dynamic clock logic for status bar
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toTimeString().split(' ')[0];
  }
  setInterval(updateClock, 1000);
  updateClock();
  updatePrompt();

  // 4. COMMAND LOGIC
  const commands = {
    help: () => print("Available: ls, cd, cat, neofetch, nmap, clear, whoami, pwd, history"),
    pwd: () => print("/" + currentPath.join("/")),
    ls: () => {
      const items = Object.keys(getCWD());
      items.forEach(item => {
        const isDir = typeof getCWD()[item] === 'object';
        print(item + (isDir ? "/" : ""), isDir ? 'dir' : 'file');
      });
    },
    cd: (args) => {
      const target = args[0];
      if (!target || target === "~") {
        currentPath = ["home", "lewis"];
      } else if (target === "..") {
        if (currentPath.length > 2) currentPath.pop();
      } else {
        const dir = getCWD();
        if (dir[target] && typeof dir[target] === 'object') {
          currentPath.push(target);
        } else {
          print(`cd: no such directory: ${target}`, 'error');
        }
      }
      updatePrompt();
    },
    cat: (args) => {
      const file = args[0];
      const dir = getCWD();
      if (dir[file] && typeof dir[file] === 'string') {
        print(dir[file]);
      } else {
        print(`cat: ${file || ''}: No such file or directory`, 'error');
      }
    },
    nmap: async (args) => {
      const target = args[0] || "127.0.0.1";
      print(`Starting Nmap scan on ${target}...`);
      await new Promise(r => setTimeout(r, 800));
      print("Discovering open ports...");
      await new Promise(r => setTimeout(r, 1200));
      print("PORT     STATE  SERVICE\n22/tcp   open   ssh\n80/tcp   open   http\n443/tcp  open   https\n5432/tcp closed postgresql");
    },
    neofetch: () => {
      print(`
       /\\         lewis@arch-9950x
      /  \\        ----------------
     /    \\       OS: Arch Linux x86_64
    /      \\      Kernel: 6.12.arch1-1
   /   ,,   \\     Uptime: 4 days, 12 hours
  /   |  |   \\    CPU: AMD Ryzen 9 9950X
 /_-''    ''-_\\   GPU: AMD Radeon RX 7900XTX
                  RAM: 14GB / 32GB (43%)
      `, 'exec-gold');
    },
    whoami: () => print("lewis (UID: 1000) - Eastbourne Cyber Division"),
    clear: () => { output.innerHTML = ''; },
    history: () => { history.forEach((cmd, i) => print(`${i}  ${cmd}`)); }
  };

  // 5. INPUT HANDLING & EVENT LOOPS
  input.addEventListener('keydown', async (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const parts = input.value.split(' ');
      const last = parts.pop();
      const match = Object.keys(getCWD()).find(k => k.startsWith(last));
      if (match) {
        parts.push(match);
        input.value = parts.join(' ');
      }
    }

    if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (history.length > 0 && historyIdx < history.length - 1) {
        historyIdx++;
        input.value = history[history.length - 1 - historyIdx];
      }
    }

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (historyIdx > 0) {
        historyIdx--;
        input.value = history[history.length - 1 - historyIdx];
      } else if (historyIdx === 0) {
        historyIdx = -1;
        input.value = '';
      }
    }

    if (e.key === 'Enter') {
      const rawInput = input.value.trim();
      input.value = '';
      historyIdx = -1;
      
      if (!rawInput) return;
      
      // Log history
      history.push(rawInput);
      
      // Echo the command execution line
      const pathStr = "~/" + currentPath.slice(2).join("/");
      const echoDiv = document.createElement('div');
      echoDiv.className = 'line prompt-row';
      echoDiv.innerHTML = `<span class="user">lewis</span>@<span class="host">arch</span>:<span class="cwd">${pathStr}</span>$ ${rawInput}`;
      output.appendChild(echoDiv);

      const parts = rawInput.split(' ');
      const cmd = parts[0];
      const args = parts.slice(1);

      if (commands[cmd]) {
        await commands[cmd](args);
      } else {
        print(`bash: command not found: ${cmd}`, 'error');
      }
      output.scrollTop = output.scrollHeight;
    }
  });

  // Keep focus on input element on terminal clicks
  document.addEventListener('click', () => input.focus());
</script>

</body>
</html>
